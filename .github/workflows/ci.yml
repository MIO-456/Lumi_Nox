name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source, docs and tests (Ubuntu)
        if: runner.os == 'Linux'
        run: bash ./init.sh
      - name: Verify source, docs and tests (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./init.ps1
