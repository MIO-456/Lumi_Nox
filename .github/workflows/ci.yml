name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile public source
        run: python -m compileall -q .
      - name: Run zero-dependency tests
        run: python -m unittest discover -s tests -v
